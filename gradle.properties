org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true
# Disabled while the 26.3 build stabilises; re-enable once the configuration is settled.
org.gradle.configuration-cache=false
# Loom 1.16+ (required by Minecraft 26.x) needs a Java 25 Gradle daemon; the toolchain below
# only controls what compiles the sources, not the JVM running Gradle itself.
org.gradle.java.home=D:/Program Files/Java/zulu-25

# Minecraft and mappings used by the ProjectEF Neo release.
minecraft_version=26.3
# Fabric loader parses [a,b) as the intersection of two ranges, which comes out empty and matches
# nothing. >=26.3 <26.4 is the working spelling for the same window.
minecraft_version_range=>=26.3 <26.4
# Minecraft 26.1+ ships unobfuscated, so there are no mappings and Loom no longer remaps.
loom_version=1.18.2
loader_version=0.19.5
loader_version_range=>=0.19.5
fabric_version=0.165.0+26.3

mod_id=projectexpansion
mod_name=ProjectExpansionNeo
mod_version=1.2.0
mod_group_id=cool.furry.mc.neoforge
mod_license=MIT
# ProjectEF 26.3 has no GitHub release yet; point -Pprojectef_jar at the local build instead.
projectef_version=1.3.4

fcap_version=26.3.1
fcap_version_range=>=26.3.0
permissions_api_version=0.7.0
jei_version=31.17.0.107
emi_version=1.1.24
jade_version=26.3.5+fabric
wthit_version=20.0.0
trinkets_version=4.2.1+26.3
cca_version=8.1.0
recipe_viewer=jei